<!DOCTYPE html>

        <nav class = "nav">

        <main>

            <section class="imgform" id="imgform">

                    <fieldset>

                        <h1 id="title">Login</h1>
                        <label for="email" id="emailLabel"> </label>
                        <input type="email" name="email" required id="email">
                        
                        <label for="password" id="passwordLabel"> </label>

                        <input type="submit" id="Login" value="Login" class="btn">

                        <p id = "ConfirmMessage"></p>

                        <a href="signup.html" class="loginlink">Don't have an account? Sign up here</a>
                    
                    </fieldset>
                </form>
            </section>

                <section class="bottom" id="bottom">
