<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="global.css">
    <link rel="icon" type="image/x-icon" href="/assets/logo2.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body data-page="profile">

<nav class="nav">
    <div class="logo-wrap">
        <div class="logo-inner">
            <img src="/assets/logo2.ico" alt="ChipIn logo" class="logo-favicon">
            <a href="index.html" class="logo">ChipIn™</a>
        </div>
        <p>Every hand makes a difference</p>
    </div>

    <button class="hamburger" id="hamburger">
        <i class="fas fa-bars"></i>
    </button>

    <div class="nav-right" id="nav-right">

        <a href="index.html" class="report-btn">
            <span class="report-text">Home</span>
            <i class="fa-solid fa-house report-plus"></i>
        </a>

        <div class="nav-divider"></div>

        <a href="profile.html" class="report-btn">
            <span class="report-text">Profile</span>
            <i class="fa-solid fa-user report-plus"></i>
        </a>

        <div class="nav-divider"></div>

        <a href="report-task.html" class="report-btn">
            <span class="report-text">Create a task</span>
            <i class="fa-solid fa-plus report-plus"></i>
        </a>

        <div class="nav-divider"></div>

        <a href="#" class="report-btn" id="signout-btn">
            <span class="report-text">Sign out</span>
            <i class="fa fa-sign-out report-plus"></i>
        </a>

    </div>

</nav>

<div class="nav-overlay" id="nav-overlay"></div>

<div class="profile-layout">

    <main class="profile-main">

        <section class="profile-banner">
            <h1>Welcome back John!</h1>
            <p>Here's an overview of your community impact.</p>
        </section>

        <section class="stats-container">
            <div class="stat-card">
                <h2 id="stat-completed">0</h2>
                <span>Completed tasks</span>
            </div>

            <div class="stat-card">
                <h2 id="stat-active">0</h2>
                <span>Active tasks</span>
            </div>
<!-- 
            <div class="stat-card">
                <h2 id="stat-helped">0</h2>
                <span>Volunteers Helped</span>
            </div> -->
        </section>

        <section class="dashboard-section">
            <h2 class="dashboard-title">
                Active tasks
            </h2>

            <div id="activeTaskList"></div>
            
        </section>

        <section class="dashboard-section">
            <h2 class="dashboard-title">Your reported tasks</h2>
            <div id="reportedTaskList"></div>
        </section>

        <section class="dashboard-section">
            <h2 class="dashboard-title">
                Completed tasks
            </h2>
            <div id="completedTaskList"></div>
        </section>

    </main>

    <aside class="sidebar-ReportTask">
        <div class="profile-section">
            <div class="profile-pic">
                <img id="profilePreview">

                <i class="fa fa-user" id="profileIcon"></i>

                <label for="profileUpload" class="camera-overlay">
                    <i class="fa fa-camera"></i>
                </label>

                <input type="file"
                        id="profileUpload"
                        accept="image/*"
                        style="display:none;">
            </div>

            <p class="profile-name">John Smith</p>
            <p class="profile-role">
                Community Contributor
            </p>
            <div id="star-display"></div>
        </div>

        <form action="/form" id="myForm" method="post">

            <fieldset>

                <label for="firstname" id="firstnameLabel"></label>
                <input type="text" name="firstname" required id="firstname">

                <label for="lastname" id="lastnameLabel" maxlength="20"></label>
                <input type="text" name="lastname" required id="lastname">

                <label for="email" id="emailLabel"></label>
                <input type="email" name="email" required id="email">

                <label for="Address" id="AddressLabel"></label>
                <input type="text" name="Address" required id="Address">

                <input type="submit"
                        id="SaveChanges"
                        value="Save Changes"
                        class="btn">

                <button type="button" id="deleteAccount" class="btn btn-delete">
                    Delete account
                </button>

                <p id="ConfirmMessage"></p>

            </fieldset>
        </form>
    </aside>
</div>

<div class="rating-modal" id="ratingModal">
    <div class="rating-modal-inner">
        <h2>Rate your volunteer</h2>
        <p id="rating-volunteer-name"></p>
        <div class="star-rating" id="submit-star-rating">
            <span class="fa fa-star" data-value="1"></span>
            <span class="fa fa-star" data-value="2"></span>
            <span class="fa fa-star" data-value="3"></span>
            <span class="fa fa-star" data-value="4"></span>
            <span class="fa fa-star" data-value="5"></span>
        </div>
        <textarea id="rating-review" placeholder="Leave a review (optional)"></textarea>
        <button id="submit-rating-btn">Submit Rating</button>
        <button id="skip-rating-btn">Skip</button>
    </div>
</div>

<script src="./scripts/joinapp.js"></script>
<script src="./scripts/helpers.js"></script>
<script src="./scripts/profile.js"></script>

</body>
</html>
