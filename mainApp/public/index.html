<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home page</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="global.css">
        <link rel="stylesheet" href="index.css">
        <link rel="icon" type="image/x-icon" href="/assets/logo2.ico">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>
    <body data-page="home">
        <nav class="nav">
            <div class="logo-wrap">
                <div class="logo-inner">
                    <img src="/assets/logo2.ico" alt="ChipIn logo" class="logo-favicon">
                    <a href="index.html" class="logo">ChipIn™</a>
                </div>
                <p>Every hand makes a difference</p>
            </div>

            <div class="nav-buttons">
                <button class="filter-toggle" id="filter-toggle" aria-label="Open filters">
                    <i class="fas fa-filter"></i>
                </button>

                <button class="hamburger" id="hamburger" aria-label="Open navigation menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="nav-right" id="nav-right">

                <a href="index.html" class="report-btn">
                    <span class="report-text">Home</span>
                    <i class="fa-solid fa-house report-plus"></i>
                </a>

                <div class="nav-divider"></div>


                <a href="profile.html" href="#" class="report-btn">
                    <span class="report-text">Profile</span>
                    <i class="fa-solid fa-user report-plus"></i>
                </a>

                <div class="nav-divider"></div>

                <a href="report-task.html" class="report-btn">
                    <span class="report-text">Report Task</span>
                    <i class="fa fa-plus report-plus"></i>
                </a>

                <div class="nav-divider"></div>

                <a href="#" class="report-btn" id="signout-btn">
                    <span class="report-text">Sign out</span>
                    <i class="fa fa-sign-out report-plus"></i>
                </a>
            </div>
        </nav>

        <div class="nav-overlay" id="nav-overlay"></div>  
        <div class="header"></div>

        <aside class="sidebar" id="filter-sidebar">
            <div class="filter-header">
                <span>Filters</span>
            </div>

            <form id ="categoriesForm" method="post">
                <h3 id="title">Categories</h3>
                <label for="repair">
                    <input type="checkbox" id="repair" name="repair">
                    Repair
                </label>
                <label for="learning">
                    <input type="checkbox" id="learning" name="learning">
                    Learning
                </label>
                <label for="digital">
                    <input type="checkbox" id="digital" name="digital">
                    Digital
                </label>
            </form>

            <form id="volunteersForm" method="post">
                <h3 id="title">Volunteers needed</h3>
                <label for="1person">
                    <input type="checkbox" id="1person" name="1person">
                    1 person needed
                </label>
                <label for="4person">
                    <input type="checkbox" id="4person" name="4person">
                    2-4 people needed
                </label>
                <label for="5person">
                    <input type="checkbox" id="5person" name="5person">
                    5+ people needed
                </label>
            </form>
        </aside>

        <main class="main-content">
            <!-- <section class="welcome-banner">
                JSON inserts welcome text
            </section> -->

            <section class="task-controls">
                <div class="search-area">
                    <input id="search-input" type="text" placeholder="Search tasks...">
                </div>

                <div class="sort-area">
                    <span>Sort by:</span>
                    <select id="sort-select">
                        <option>Newest</option>
                        <option>Oldest</option>
                    </select>
                </div>

            </section>

            <section class="task-grid" id="task-grid">
                <!-- empty to be dynamically loaded instead -->
            </section>

            <section class="pagination-container">
                <div class="results-count">
                    <!-- dynamically load result count -->
                </div>
            </section>

        </main>   

        <div class="task-modal" id="taskModal">
            <div class="modal">
                <button class="modal-close" id="modalClose">
                    <i class="fa fa-times"></i>
                </button>

                <div class="modal-body">
                    <div class="modal-left">
                        <div class="task-modal-img">
                            <img id="modalImg" src="assets/Placeholder.png" alt="Task image">
                        </div>
                        <div class="task-modal-desc">
                            <p id="modalDesc"></p>
                        </div>
                    </div>

                    <div class="modal-right">
                        <h2 id="modalTitle" class="modal-title"></h2>
                        <div class="modal-map">
                            <div id ="map"></div>
                            <div class="map-placeholder">
                                <i class="fa fa-map-marker-alt"></i>
                                <span id="modalLocation">Location TBC</span>
                            </div>
                        </div>
                        <button class="volunteer-btn" id="volunteerBtn">Volunteer now</button>
                    </div>
                </div>

            </div>
        </div>
        
        <p id="ConfirmMessage"></p>
    <script>
            var map = L.map('map', { zoomControl: false }).setView([51.505, -0.09], 15);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
            navigator.geolocation.watchPosition(success, error);
 
            let circle;
 
            function success(pos) {
                const address = "28E Jessopp Rd, Norwich NR2 3QB";
                fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json`)
                .then(response => response.json())
                .then(data => {
                    console.log(data)
                    if (data.length > 0) {
                    const lat = data[0].lat;
                    const lng = data[0].lon;
 
                    if (circle) { map.removeLayer(circle); }
 
                    circle = L.circle([lat, lng], {
                        radius: 300,
                        color: '#4a90d9',
                        fillColor: '#4a90d9',
                        fillOpacity: 0.15,
                        weight: 2,
                        opacity: 0.4
                    }).addTo(map);
 
                    map.setView([lat, lng], 15);
                    }})
            }
 
            function error(err) {
                if (err.code === 1) {
                    alert("please allow geolocation access!");
                } else {
                    alert("cannot get current location");
                }
            }  
        </script>

        <script src="./scripts/modal.js"></script>  
        <script src="./scripts/helpers.js"></script>
        <script src="./scripts/joinapp.js"></script>
        <script src="./scripts/index.js"></script>
    </body>
</html>
