        <section class="imgform" id="imgform">
            <form action="/form" id="myForm" method="post">
                <fieldset>

                    <h1 id="title">Create Account</h1>

                    <label for= "Firstname" id= "Firstname"></label>
                    <input type="text" name="Firstname" required id="Firstname">

                    <input type="text" name="lastname" required id="lastname">

                    <label for="password" id="passwordLabel"> </label>
                    <input type="password" name="password" required id="password">

                    <input type="submit" id="Create Account" value="Create Account" class="btn">

                    <p id = "ConfirmMessage"></p>

                    <a href="login.html" class="loginlink">Already have an account? Login here</a>
