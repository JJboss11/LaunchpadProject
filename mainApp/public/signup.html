<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign up page</title>
        <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="stylesheet.css">
        <link rel="stylesheet" href="signupStyles.css">
        <link rel="icon" type="image/x-icon" href="/assets/logo2.ico">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>

    <body data-page="form">
        
        <nav class = "nav">
            <div class="logo-wrap">
                <div class="logo-inner">
                    <img src="/assets/logo2.ico" alt="ChipIn logo" class="logo-favicon">
                    <a href="index.html" class="logo">ChipIn™</a>
                </div>
                <p>Every hand makes a difference</p>
            </div>

            <ul class="nav-links">

            </ul>

            <div class="nav-right">
                <div class="nav-icons">
                </div>   
            </div>
        </nav>

        <main>
            <section class="imgform" id="imgform">
                <form action="/form" id="myForm" method="post">
                    <fieldset>
                        <h1 id="title">Create Account</h1>

                        <label for= "Firstname" id= "firstnameLabel"></label>
                        <input type="text" name="firstname" required id="firstname">

                        <label for="lastname" id="lastnameLabel" maxlength ="20"></label>
                        <input type="text" name="lastname" required id="lastname">

                        <label for="email" id="emailLabel"> </label>
                        <input type="email" name="email" required id="email">
                        
                        <label for="password" id="passwordLabel"> </label>
                        <input type="password" name="password" required id="password">

                        <div class="show-password-wrapper">
                            <input type="checkbox" onclick="showPswrd()" id="showPassword">
                            <label for="showPassword">Show password</label>
                        </div>

                        <input type="submit" id="Create Account" value="Create Account" class="btn">

                        <p id = "ConfirmMessage"></p>

                        <a href="login.html" class="loginlink">Already have an account? Login here</a>
                    </fieldset>
                </form>
            </section>
        </main>

            <footer>
            </footer>
        <script src="./scripts/helpers.js"></script>
        <script src="./scripts/joinapp.js"></script>
    </body>
</html>
