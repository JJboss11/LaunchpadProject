<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Report task</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">    
            <link rel="stylesheet" href="global.css">
            <link rel="stylesheet" href="report-task.css">
            <link rel="icon" type="image/x-icon" href="/assets/logo2.ico">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/font-awesome.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        </link>
    </head>


    <body data-page="home">
        <nav class = "nav">
            <div class="logo-wrap">
                <div class="logo-inner">
                    <img src="/assets/logo2.ico" alt="ChipIn logo" class="logo-favicon">
                    <a href="index.html" class="logo">ChipIn™</a>
                </div>
                <p>Every hand makes a difference</p>
            </div>

            <button class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </button>

            <div class="nav-right" id="nav-right">

                <a href="index.html" class="report-btn">
                    <span class="report-text">Home</span>
                    <i class="fa-solid fa-house report-plus"></i>
                </a>

                <div class="nav-divider"></div>

                <a href="profile.html" class="report-btn">
                    <span class="report-text">Profile</span>
                    <i class="fa-solid fa-user report-plus"></i>
                </a>

                <div class="nav-divider"></div>

                <a href="report-task.html" class="report-btn">
                    <span class="report-text">Create a task</span>
                    <i class="fa-solid fa-plus report-plus"></i>
                </a>

                <div class="nav-divider"></div>

                <a href="#" class="report-btn" id="signout-btn">
                    <span class="report-text">Sign out</span>
                    <i class="fa fa-sign-out report-plus"></i>
                </a>

            </div>
        </nav>

        <div class="nav-overlay" id="nav-overlay"></div>

        <aside class="sidebar-report">
            <div class="category-grid">
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">Create a task</h1>

            <form id="reportForm" novalidate>

                <!-- Task details -->
                <fieldset class="form-section">
                    <legend class="form-section-header">Task details</legend>

                    <label for="task-title">Title<span class="req">*</span>
                        <input type="text" id="task-title" class ="task-input" name="title" placeholder="Placeholder" required>
                    </label>

                    <label for="task-desc">Description
                        <textarea id="task-desc" name="description" placeholder="Placeholder" required></textarea>
                    </label>
                </fieldset>

                <!-- Location and Time -->
                <fieldset class="form-section">
                    <legend class="form-section-header">Location and Time</legend>
                    <section class="row-2">
                        <label for="task-address">Address
                            <input type="text" id='task-address' class="task-input" name="address" placeholder="Street address" required>
                        </label>

                        <label for="task-time">Time
                            <input type="time" id="task-time" class="task-time" name="time" placeholder="HH:MM" required>
                        </label>

                        <label for="task-date">Date
                            <input type="date" id="task-date" name="date" placeholder="DD/MM/YY">
                        </label>
                    </section>
                </fieldset>

                <!-- Volunteers needed -->
                <fieldset class="form-section">
                    <legend class="form-section-header">Volunteers needed</legend>
                    <label for="task-volunteers">How many volunteers do you need?<span class="req">*</span>
                        <input type="number" id="task-volunteers" class="task-volunteers" name="volunteers" placeholder="Max 15" min="1" max="15" required>
                    </label>
                </fieldset>

                <!-- Photo -->
                <fieldset class="form-section">    
                    <legend class="form-section-header">Photo</legend>

                    <label for="task-photo" class="photo-upload-area">
                        <i class="fa fa-camera" aria-hidden="true" id="upload-icon"></i>
                        <span id="upload-text">Click to upload a photo of the issue</span>
                        <small id="upload-hint">JPG or PNG max 1MB</small>
                        <input type="file" id="task-photo" name="photo" accept="image/jpeg,image/png" class="sr-only">
                    </label>
                </fieldset>

                 <div class="category-label">
                Category </div>
                <button type="button" class="cat-btn" data-category="Repair"><i class="fa fa-wrench"></i> <span>Repair</span></button>
                <button type="button" class="cat-btn" data-category="Learning"><i class="fa fa-graduation-cap"></i><span>Learning</span></button>
                <button type="button" class="cat-btn" data-category="Digital"><i class="fa fa-desktop"></i><span>Digital</span></button>
                <button type="button" class="cat-btn" data-category="Other"><i class="fa fa-ellipsis-h"></i><span>Other</span></button>

                <p id="formMessage"></p>
                <!-- Actions -->
                <footer class="form-actions"> 
                    
                    <button type="reset" class="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-submit">Submit</button>
                </footer>

            </form>
        </main>
    </body>
    <script src="./scripts/report-task.js"></script>
    <script src="./scripts/helpers.js"></script>
</html>
